<style>
  :root{
    /* ===== Designsystemet (ADR 0056) ======================================
       Hvit flate, hårfine linjer, typografisk hierarki og en dempet palett —
       ikke fargefylte flater og avrundede kort. Lesbarhet foran stil: alle
       tekstfarger er målt mot sin bakgrunn og består WCAG AA (4,5:1) for liten
       tekst. Endrer du en farge her, kjør kontrastsjekken i tests/browser.mjs. */
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f4f5f7;          /* hover, aktiv segmentknapp, inputfelt i ro */
    --ink:#161b24;                /* 17,3:1 på hvit */
    --ink-soft:#434b5a;           /*  8,8:1 */
    --ink-muted:#626a79;          /*  5,4:1 — datoer, antall, hjelpetekst. Var 3,1:1. */
    --line:#e3e6eb;
    --line-soft:#eceef2;
    --accent:#1c2638;
    --accent-soft:#434b5a;
    --alert:#b03a2b;              /*  6,0:1 — forfalt, slett, Urgent */
    --alert-bg:#fbefed;
    --success:#3f7a4f;
    --work:#3b5884;               /*  7,2:1 — var 4,2:1 */
    --privat:#985260;             /*  5,7:1 — var 2,6:1 */
    --personlig:#985260;
    --helse:#4f7a5b;
    --reise:#8a6a2c;
    /* Prioritet. Brukes som en liten prikk eller en 3 px strek, aldri som flate. */
    --pri-urgent:#b03a2b; --pri-short:#a3671b; --pri-long:#3b5884; --pri-proj:#6b7383;
    /* Stjernemerking (ADR 0055). Dempet gull: den skal løfte raden ut av lista uten
       å slåss med den røde fristfargen rett ved siden av. */
    --star:#9a7516; --star-bg:#fcf7ea; --star-line:#e6d6a6;   /* 4,3:1 — grafisk merke, ikke tekst (krav 3:1) */
    /* Bøttevariablene lever videre for de få stedene som fortsatt tegner en tonet
       flate (ukeagendaen, kanban). I To Do's og på Hjem er de erstattet av prikker. */
    --bh-urgent-bg:#fbefed; --bh-urgent-ink:#8a2c20;
    --bh-short-bg:#f8f1e4;  --bh-short-ink:#7a4f14;
    --bh-long-bg:#edf1f7;   --bh-long-ink:#2f4a72;
    --bh-urgent-line:#efcbc5; --bh-short-line:#ead7b4; --bh-long-line:#cdd8e8;
    --surface-dim:#f8f9fa;        /* helg, andre måneds dager */
    --ics-bg:#f1f5fa; --ics-line:#5b84b0;
    --today:#f4f6fa;
    --shadow:0 1px 2px rgba(15,20,30,.06);
    --shadow-elev:0 12px 40px rgba(15,20,30,.14), 0 2px 6px rgba(15,20,30,.06);
    --radius:6px;                 /* var 12 px. Bare på knapper, felt og dialoger — aldri på seksjoner. */
    --radius-sm:4px;
    /* Én skriftfamilie: systemets egen. Segoe UI på Windows, SF på iPhone og Mac.
       Ingen nedlasting, ingen ventetid, fungerer offline. Inter sist for Linux. */
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
    /* Serifen er borte (ADR 0056). Variabelen peker på samme familie, så eldre
       regler og innebygde stiler som fortsatt nevner den, følger med. */
    --serif:var(--font);
    /* Skriftskala — åtte trinn i stedet for 28. 11 bare der kalenderen er tett. */
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:26px;
  }
  /* Dark mode palette */
  [data-theme="dark"]{
    --bg:#0f1216;
    --surface:#14181d;
    --surface-2:#1c2128;
    --ink:#e8ebf0;
    --ink-soft:#b4bac5;
    --ink-muted:#939bab;          /* 6,4:1 på --surface */
    --line:#262c35;
    --line-soft:#1f242c;
    --accent:#e8ebf0;
    --accent-soft:#b4bac5;
    --alert:#ef8471;
    --alert-bg:#2a1916;
    --success:#7fb08c;
    --work:#93acd3;
    --privat:#d89ea8;
    --personlig:#d89ea8;
    --helse:#93bb9d;
    --reise:#d6b276;
    --pri-urgent:#ef8471; --pri-short:#d9a55c; --pri-long:#93acd3; --pri-proj:#9aa2b0;
    --star:#d9b96a; --star-bg:#221f15; --star-line:#4d4428;
    --bh-urgent-bg:#2a1916; --bh-urgent-ink:#f0a99d;
    --bh-short-bg:#2a2216;  --bh-short-ink:#e2c08e;
    --bh-long-bg:#18202c;   --bh-long-ink:#aec2e0;
    --bh-urgent-line:#4a2b26; --bh-short-line:#463a26; --bh-long-line:#2c3a4e;
    --surface-dim:#12161b;
    --ics-bg:#172231; --ics-line:#7fa6cc;
    --today:#1a2029;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-elev:0 12px 40px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .2s ease, color .2s ease}
  h1,h2,h3,h4{margin:0;font-family:var(--font);font-weight:600;letter-spacing:-.015em;color:var(--ink)}
  h2{font-size:26px;line-height:1.2;letter-spacing:-.025em}
  h3{font-size:16px;line-height:1.3}
  h4{font-size:15px;line-height:1.3}
  body{min-height:100vh;min-height:100dvh}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--ink);text-decoration:none}

  /* Layout */
  #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  header.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--font);font-size:16px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
  .brand .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:9px;vertical-align:1px}
  .topbar-spacer{flex:1}
  .nav{display:flex;gap:2px;background:none;border-radius:0;padding:0}
  .nav button{padding:9px 10px;border-radius:0;color:var(--ink-soft);font-size:13px;font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent;transition:color .12s,box-shadow .12s}
  .nav button.active{background:none;color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
  .nav button .badge{display:inline-block;background:none;color:var(--alert);font-size:12px;padding:0;margin-left:4px;font-weight:600;line-height:1;vertical-align:baseline;min-width:0;font-variant-numeric:tabular-nums}
  .nav button.active .badge{background:none}
  .filter{display:flex;gap:2px;background:none;border:1px solid var(--line);border-radius:7px;padding:2px}
  .filter button{padding:5px 11px;border-radius:5px;color:var(--ink-soft);font-size:13px;font-weight:500}
  .filter button.active{background:var(--surface-2);color:var(--ink);box-shadow:none;font-weight:600}
  .top-actions{display:flex;gap:6px;align-items:center}
  .icon-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}

  main{flex:1;padding:18px 18px 110px}
  .container{max-width:1200px;margin:0 auto}

  /* Sub-nav (date title + arrows) */
  .subnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .subnav h2{font-family:var(--font);font-weight:600;font-size:20px;margin:0;color:var(--ink);letter-spacing:-.015em}
  .subnav h2 .yr{color:var(--ink-muted);font-style:normal;font-weight:400;margin-left:8px;font-size:15px;letter-spacing:0}
  .subnav .arrows{display:flex;gap:4px}
  .subnav .arrows button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .subnav .arrows button:hover{background:var(--surface-2)}
  .subnav .today-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13px}

  .strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .strip .group{display:flex;flex-direction:column;gap:2px;min-width:140px}
  .strip .label{font-size:11px;font-weight:600;letter-spacing:0;color:var(--ink-muted);}
  .strip .value{font-family:var(--font);font-size:15px;color:var(--ink)}
  .strip .value.empty{font-style:normal;color:var(--ink-muted);font-family:var(--font);font-size:13px}
  .strip .edit{margin-left:auto}

  /* Overview grid */
  .overview{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  
  
  
  .mo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;transition:transform .1s ease,box-shadow .1s ease}
  .mo:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .mo h3{font-family:var(--font);font-weight:600;font-size:15px;margin:0 0 4px;color:var(--ink)}
  .mo .yr{font-size:11px;color:var(--ink-muted);margin-bottom:8px;letter-spacing:.5px}
  .mo .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:11px}
  .mo .mini .h{color:var(--ink-muted);text-align:center;padding:1px 0;font-weight:600}
  .mo .mini .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;border-radius:3px;font-size:11px}
  .mo .mini .d.empty{color:transparent}
  .mo .mini .d.has-events{background:var(--surface-2)}
  .mo .mini .d.today{background:var(--today);color:var(--ink);font-weight:600;outline:1px solid var(--accent)}
  .mo .mini .d.holiday{color:var(--alert)}
  .mo .mini .d.weekend{color:var(--ink-muted)}
  .mo .mini .d .dotbar{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
  .mo .mini .d .dotbar i{width:3px;height:3px;border-radius:50%;display:inline-block}
  .mo .stats{margin-top:8px;font-size:11px;color:var(--ink-muted);display:flex;justify-content:space-between}

  /* Month view */
  .month-grid{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  /* minmax(0,1fr), ikke 1fr: `1fr` er `minmax(auto,1fr)`, og auto-minimum er innholdets
     minste bredde. Hver ukerad er sitt eget rutenett, så en lang hendelsestittel gjorde
     sin kolonne bred og nabokolonnene smale — og bredden varierte fra uke til uke.
     Målt på desktop før fiksen: 42 celler med bredder fra 26 til 474 px. ADR 0051. */
  .month-grid .row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .month-grid .row.head{background:none}
  /* min-height:0 — ellers arvet ukedagsraden cellenes 110 px og ble et tomt bånd over datoene. */
  .month-grid .row.head .cell{min-height:0;padding:8px;font-size:12px;letter-spacing:0;color:var(--ink-soft);font-weight:500;text-align:left;border-right:none;border-top:none}
  .month-grid .row.head .cell:last-child{border-right:none}
  .month-grid .cell{border-top:1px solid var(--line-soft);border-right:1px solid var(--line-soft);min-height:110px;padding:6px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;transition:background .1s}
  .month-grid .cell:nth-child(7n){border-right:none}
  .month-grid .cell:hover{background:var(--surface-2)}
  .month-grid .cell.other{background:var(--surface-dim);color:var(--ink-muted)}
  .month-grid .cell.today{background:var(--today)}
  .month-grid .cell .num{font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
  .month-grid .cell.today .num{color:var(--ink)}
  .month-grid .cell .num .holiday-tag{font-size:11px;color:var(--alert);font-weight:500}
  .month-grid .cell .ev{font-size:12px;line-height:1.25;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--ink-muted)}
  .month-grid .cell .ev.cat-arbeid{border-left-color:var(--work)}
  .month-grid .cell .ev.cat-privat{border-left-color:var(--privat)}
  .month-grid .cell .ev.cat-personlig{border-left-color:var(--personlig)}
  .month-grid .cell .ev.cat-helse{border-left-color:var(--helse)}
  .month-grid .cell .ev.cat-reise{border-left-color:var(--reise)}
  .month-grid .cell .more{font-size:11px;color:var(--ink-muted)}

  

  /* Week view */
  .week{display:grid;grid-template-columns:60px repeat(7,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:12px}
  .week .wh{background:var(--surface-2);padding:8px;text-align:center;font-size:11px;color:var(--ink-muted);font-weight:600;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .week .wh strong{display:block;color:var(--ink);font-size:15px;font-weight:600;font-family:var(--font)}
  .week .wh.today strong{color:var(--accent)}
  .week .wh:last-child{border-right:none}
  .week .hour-label{padding:4px 8px;font-size:11px;color:var(--ink-muted);text-align:right;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .week .slot{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);height:42px;position:relative;cursor:pointer;overflow:visible}
  .week .slot:nth-child(8n){border-right:none}
  .week .slot.weekend{background:var(--surface-dim)}
  .week .slot:hover{background:var(--surface-2)}
  .week .slot .ev{position:absolute;left:2px;right:2px;background:var(--surface);border-left:3px solid var(--ink-muted);padding:3px 6px;border-radius:4px;font-size:11px;line-height:1.2;overflow:hidden;box-shadow:var(--shadow)}
  .week .slot .ev.cat-arbeid{border-left-color:var(--work)}
  .week .slot .ev.cat-privat{border-left-color:var(--privat)}
  .week .slot .ev.cat-personlig{border-left-color:var(--personlig)}
  .week .slot .ev.cat-helse{border-left-color:var(--helse)}
  .week .slot .ev.cat-reise{border-left-color:var(--reise)}

  

  /* Day view */
  .day-layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
  
  .day-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .day-side{display:flex;flex-direction:column;gap:28px}
  /* ADR 0057: sidepanelene er seksjoner som resten av appen — overskrift med strek, ingen boks */
  .day-side .panel{background:none;border:none;border-radius:0;padding:0}
  .day-side .panel h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--ink);font-family:var(--font);font-weight:600;font-size:14px;color:var(--ink)}
  .day-hours{display:grid;grid-template-columns:50px 1fr;gap:0}
  .day-hours .hl{padding:4px;font-size:11px;color:var(--ink-muted);text-align:right;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .day-hours .hslot{border-bottom:1px solid var(--line-soft);height:48px;position:relative;cursor:pointer;padding-left:4px;overflow:visible}
  .day-hours .hslot:hover{background:var(--surface-2)}
  .day-hours .hslot .ev{position:absolute;left:4px;right:8px;background:var(--surface);border-left:3px solid var(--ink-muted);padding:4px 8px;border-radius:4px;font-size:13px;box-shadow:var(--shadow)}
  .day-hours .hslot .ev.cat-arbeid{border-left-color:var(--work)}
  .day-hours .hslot .ev.cat-privat{border-left-color:var(--privat)}
  .day-hours .hslot .ev.cat-personlig{border-left-color:var(--personlig)}
  .day-hours .hslot .ev.cat-helse{border-left-color:var(--helse)}
  .day-hours .hslot .ev.cat-reise{border-left-color:var(--reise)}

  /* List view */
  .list-view{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .list-view .lhead{padding:10px 16px;background:var(--surface-2);font-size:12px;color:var(--ink-muted);font-weight:600;letter-spacing:0;}
  .list-view .lrow{padding:10px 16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;cursor:pointer}
  .list-view .lrow:hover{background:var(--surface-2)}
  .list-view .lrow .ldate{min-width:48px;font-family:var(--font);font-size:13px;color:var(--ink-muted);line-height:1.1;text-align:center}
  .list-view .lrow .ldate .dn{font-size:16px;color:var(--ink);display:block;font-weight:500}
  .list-view .lrow .ltitle{flex:1;font-size:14px}
  .list-view .lrow .ltitle .meta{display:block;font-size:12px;color:var(--ink-muted);margin-top:1px}
  .list-view .lrow .lcat{width:8px;height:8px;border-radius:50%;background:var(--ink-muted)}
  .list-view .lrow .lcat.cat-arbeid{background:var(--work)}
  .list-view .lrow .lcat.cat-privat{background:var(--privat)}
  .list-view .lrow .lcat.cat-personlig{background:var(--personlig)}
  .list-view .lrow .lcat.cat-helse{background:var(--helse)}
  .list-view .lrow .lcat.cat-reise{background:var(--reise)}

  /* Goals & habits */
  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  
  .panel{background:none;border:none;border-radius:0;padding:0 0 20px}
  .panel h3{font-family:var(--font);font-weight:600;font-size:14px;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--ink);color:var(--ink);display:flex;justify-content:space-between;align-items:center;letter-spacing:-.005em}
  .panel h3 button{font-size:12px;font-weight:500;color:var(--ink-soft);padding:3px 9px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
  .panel h3 button:hover{background:var(--surface-2)}
  .goal{padding:10px 0;border-top:1px solid var(--line-soft)}
  .goal:first-of-type{border-top:none}
  .goal .gt{font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .goal .gt .gtarget{font-size:12px;color:var(--ink-muted);font-weight:400}
  .goal .gprog{height:4px;background:var(--surface-2);border-radius:2px;margin:8px 0;overflow:hidden}
  .goal .gprog i{display:block;height:100%;background:var(--accent)}
  .goal .gms{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
  .goal .gms li{padding:3px 0;display:flex;align-items:center;gap:8px;color:var(--ink-soft)}
  .goal .gms li.done{text-decoration:line-through;color:var(--ink-muted)}
  .goal .gms li input{margin:0}
  .habit{padding:10px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
  .habit:first-of-type{border-top:none}
  .habit .ht{flex:1;font-size:14px}
  .habit .hgrid{display:flex;gap:2px}
  .habit .hgrid .hd{width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line-soft);cursor:pointer}
  .habit .hgrid .hd.done{background:var(--accent);border-color:var(--accent)}
  .habit .hgrid .hd.today{outline:1px solid var(--accent);outline-offset:1px}

  /* Inbox */
  .inbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .inbox .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .inbox .ih h3{margin:0;font-family:var(--font);font-weight:600;font-size:16px}
  .inbox .ii{padding:8px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-size:13px}
  .inbox .ii:first-of-type{border-top:none}
  .inbox .ii .it{flex:1}
  .inbox .ii button{padding:3px 8px;font-size:12px;border-radius:5px;border:1px solid var(--line);color:var(--ink-soft)}
  .inbox .ii button:hover{background:var(--surface-2)}
  .inbox .ii .del{color:var(--alert);border-color:transparent}

  /* FAB Quick capture */
  .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(40,40,40,.18), 0 1px 3px rgba(40,40,40,.1);z-index:50;line-height:1;transition:transform .15s cubic-bezier(.2,.9,.4,1.1), box-shadow .15s ease, background-color .15s}
  .fab .icon{width:24px;height:24px}
  .fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 24px rgba(40,40,40,.22), 0 2px 5px rgba(40,40,40,.12)}
  .fab:active{transform:translateY(0) scale(.96);transition-duration:.05s}
  [data-theme="dark"] .fab{color:#1a1d24}
  

  /* Toast. Flyttet ut av app.js sin cssText da angre-knappen kom til — en knapp
     med hover-tilstand hører hjemme i CSS. ADR 0039. */
  /* ADR 0058: beskjedene bor i en stabel — inntil to over hverandre, nyeste øverst. */
  .toast-stack{position:fixed;bottom:90px;right:24px;z-index:200;max-width:340px;
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
  .toast{background:var(--accent);color:#fff;pointer-events:auto;
    padding:12px 16px;border-radius:8px;font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:340px;
    display:flex;align-items:center;gap:12px}
  [data-theme="dark"] .toast{color:#1a1d24}
  .toast .toast-action{background:transparent;border:1px solid currentColor;color:inherit;
    padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;
    white-space:nowrap;flex:0 0 auto}
  .toast .toast-action:hover{background:rgba(255,255,255,.16)}
  [data-theme="dark"] .toast .toast-action:hover{background:rgba(0,0,0,.12)}
  

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(40,46,60,.34);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-elev)}
  .modal h3{margin:0;padding:18px 20px 14px;font-family:var(--font);font-weight:600;font-size:16px;letter-spacing:-.01em;border-bottom:1px solid var(--line-soft)}
  .modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .modal .field{display:flex;flex-direction:column;gap:5px}
  .modal .field label{font-size:12px;letter-spacing:0;color:var(--ink-soft);font-weight:600}
  .modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:14px;color:var(--ink);transition:border-color .12s,box-shadow .12s}
  .modal .field textarea{min-height:70px;resize:vertical;font-family:var(--font)}
  .modal .field .row{display:flex;gap:8px}
  .modal .field .row > *{flex:1}
  .modal .footer{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}
  .modal .footer button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .modal .footer button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modal .footer button.danger{color:var(--alert);border-color:transparent;margin-right:auto}
  .modal .ms-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .modal .ms-list li{display:flex;align-items:center;gap:6px}
  .modal .ms-list input[type="text"]{flex:1}
  .modal .ms-list input[type="date"]{width:140px}
  .modal .ms-list .rm{padding:4px 8px;color:var(--alert);border:none;background:none}
  .modal .add-link{font-size:13px;color:var(--ink-soft);padding:4px 0;text-align:left}

  /* Settings drawer */
  .settings-list{display:flex;flex-direction:column}
  .settings-list .sl{padding:10px 0;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .settings-list .sl:first-of-type{border-top:none}
  .settings-list .sl button{padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid var(--line);color:var(--ink-soft)}

  /* Search */
  .search-results{margin-top:10px;display:flex;flex-direction:column;gap:0}
  .search-results .sr{padding:8px 10px;border-top:1px solid var(--line-soft);cursor:pointer;font-size:13px}
  .search-results .sr:first-of-type{border-top:none}
  .search-results .sr:hover{background:var(--surface-2)}
  /* Markert rad ved piltast-navigasjon (ADR 0038). Tydeligere enn hover, siden den
     forteller hvor Enter kommer til å treffe. */
  .search-results .sr.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
  .search-results .sr .meta{font-size:12px;color:var(--ink-muted);margin-top:1px}
  .search-results .empty{padding:14px;color:var(--ink-muted);font-size:13px;text-align:center}
  /* Ukesoppsummering (ADR 0038) */
  .wr-sec{margin-bottom:16px}
  .wr-sec h4{font-family:var(--font);font-weight:600;font-size:15px;margin:0 0 6px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
  .wr-sec h4 small{font-family:var(--font);font-size:12px;color:var(--ink-muted);font-weight:400}
  .wr-row{display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-top:1px solid var(--line-soft);font-size:13px;cursor:pointer}
  .wr-row:hover{background:var(--surface-2)}
  .wr-date{flex:0 0 56px;font-size:12px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .wr-title{flex:1;min-width:0}
  .wr-empty{padding:8px 2px;font-size:13px;color:var(--ink-muted)}
  .wr-note{padding:7px 9px;margin-bottom:6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--ink-soft);line-height:1.45}

  /* Notes panel */
  .notes-area{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--font);font-size:14px;resize:vertical}

  /* Weekly review */

  /* Helpers */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:0;border-radius:0;background:none;font-size:12px;letter-spacing:0;font-weight:500;color:var(--ink-soft)}
  .pill.cat-arbeid{--dot:var(--work)}
  .pill.cat-privat{--dot:var(--privat)}
  .pill.cat-personlig{--dot:var(--personlig)}
  .pill.cat-helse{--dot:var(--helse)}
  .pill.cat-reise{--dot:var(--reise)}
  .pill.cat-other{--dot:var(--ink-muted)}
  .empty-state{padding:22px 0;text-align:left;color:var(--ink-muted);font-style:normal;font-size:13px}
  /* Tomme tilstander som fører videre i stedet for å stoppe. ADR 0043. */
  .es-act{margin-top:10px;font-style:normal}
  .es-btn{padding:5px 12px;font-size:13px;border-radius:6px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .es-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent-soft)}
  .home-empty .es-act{margin-top:8px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .hidden{display:none !important}

  /* Projects */
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;gap:12px;min-width:0}
  /* Prosjektets egen farge som venstrekant — samme nyanse som chipen på taggede
     oppgaver, så kortet og oppgaven kjennes igjen som samme sak. ADR 0041. */
  .pcard[style*="--pc-h"]{--pc-c:hsl(var(--pc-h), 38%, 50%)}
  [data-theme="dark"] .pcard[style*="--pc-h"]{--pc-c:hsl(var(--pc-h), 34%, 62%)}
  .pcard:hover{border-color:color-mix(in srgb,var(--ink-muted) 55%,var(--line));box-shadow:0 2px 12px rgba(15,20,30,.06)}
  .pcard.cat-arbeid{}
  .pcard.cat-privat{}
  .pcard.cat-personlig{}
  .pcard.cat-helse{}
  .pcard.cat-reise{}
  .pcard h3{font-family:var(--font);font-weight:600;font-size:15px;margin:0;color:var(--ink);line-height:1.3;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0}
  .pcard .pmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-muted);align-items:baseline;margin-top:4px;padding-left:16px}
  .pcard .countdown{font-family:var(--font);font-size:20px;color:var(--ink);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right;line-height:1;flex:0 0 auto;white-space:nowrap}
  .pcard .countdown.past{color:var(--ink-muted)}
  .pcard .countdown.urgent{color:var(--alert)}
  .pcard .pnext{font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:6px;margin-top:2px}
  .pcard .pnext strong{color:var(--ink)}
  .pcard .countdown small{display:block;font-family:var(--font);font-size:12px;color:var(--ink-muted);letter-spacing:0;font-weight:400;margin-top:4px}
  .pcard .pprog{flex:1;height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;min-width:40px}
  .pcard .pprog i{display:block;height:100%;background:var(--ink)}
  .pcard .pstats{display:flex;gap:12px;font-size:12px;color:var(--ink-muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .pcard .pstats span strong{color:var(--ink)}
  /* To Do-liste på prosjektkortet (ADR 0033). Titler kappes på én linje med ellipse, så
     kortene beholder samme høyde og rutenettet står rolig. */
  .pcard .ptodos{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-soft);padding-top:12px;min-width:0}
  .pcard .ptodo{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.35;color:var(--ink);min-width:0}
  /* Fast bredde på datokolonnen, så titlene flukter fra rad til rad uansett om dagen er
     ett- eller tosifret. «+N mer» er en vanlig rad med tom datocelle, så den stiller seg
     opp med titlene av seg selv. */
  /* 68 px: «5 d siden» er den lengste etiketten relDateShort() kan produsere. ADR 0040. */
  .pcard .ptodo-date{flex:0 0 64px;font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pcard .ptodo-date.overdue{color:var(--alert);font-weight:500}
  .pcard .ptodo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .ptodo-more .ptodo-title{font-size:12px;color:var(--ink-muted);font-style:normal}
  .pcard.archived{opacity:.55}

  .new-project-card{background:transparent;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:13px;min-height:120px;cursor:pointer;transition:border-color .12s,color .12s}
  .new-project-card:hover{border-color:var(--ink-muted);color:var(--ink)}

  /* Project bars on overview */
  .mo .pbars{margin-top:6px;display:flex;flex-direction:column;gap:2px;min-height:8px}
  .mo .pbar{height:5px;border-radius:2px;background:var(--ink-muted);position:relative;font-size:0;cursor:pointer}
  .mo .pbar.cat-arbeid{background:var(--work)}
  .mo .pbar.cat-personlig{background:var(--personlig)}
  .mo .pbar.cat-helse{background:var(--helse)}
  .mo .pbar.cat-reise{background:var(--reise)}

  /* Project detail page */
  .pdetail{background:none;border:none;border-radius:0;overflow:visible}
  .pdetail .phead{padding:2px 0 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .pdetail .phead .ptitle{flex:1;min-width:200px}
  .pdetail .phead h2{font-family:var(--font);font-weight:600;font-size:26px;letter-spacing:-.025em;margin:0 0 6px;color:var(--ink);line-height:1.2}
  .pdetail .phead .pdesc{font-size:14px;color:var(--ink-soft);margin:10px 0 0;max-width:68ch;line-height:1.5}
  .pdetail .phead .pcount{text-align:right;font-family:var(--font);font-size:26px;font-weight:600;letter-spacing:-.025em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .pdetail .phead .pcount small{display:block;font-family:var(--font);font-size:12px;color:var(--ink-muted);letter-spacing:0;margin-top:6px;font-weight:400}
  .pdetail .phead .pcount.urgent{color:var(--alert)}
  .pdetail .pbody{padding:0}
  .psection{padding:30px 0 0;border-top:none}
  .psection:first-of-type{border-top:none}
  .psection h4{font-family:var(--font);font-weight:600;font-size:14px;margin:0;padding-bottom:8px;border-bottom:1px solid var(--ink);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;letter-spacing:-.005em}
  .psection h4 button{font-size:12px;font-weight:500;color:var(--ink-soft);padding:4px 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
  .psection h4 button:hover{background:var(--surface-2)}
  .ptask{position:relative;padding:10px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;font-size:14px}
  .ptask:first-of-type{border-top:none}
  .ptask.done .pttitle{text-decoration:line-through;color:var(--ink-muted)}
  .ptask .pttitle{flex:1;cursor:pointer}
  .ptask .ptdate{font-size:12px;color:var(--ink-muted);font-family:var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ptask .ptdel{padding:3px 8px;color:var(--ink-muted);font-size:13px;border:none;background:none;opacity:0;transition:opacity .12s,color .12s}
  .ptask input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
  .pperson{padding:8px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
  .pperson:first-of-type{border-top:none}
  .pperson .ppname{flex:1;font-weight:500}
  .pperson .pprole{color:var(--ink-muted);font-size:12px}
  .pperson .ppstatus{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft)}
  .pperson .ppstatus.confirmed{background:var(--helse);color:#fff}
  .pperson .ppstatus.pending{background:var(--reise);color:#fff}
  .pperson .ppstatus.declined{background:var(--ink-muted);color:#fff}
  .plink{padding:6px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-size:13px}
  .plink:first-of-type{border-top:none}
  .plink a{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plink a:hover{text-decoration:underline}
  .pinline-add{display:flex;gap:6px;margin-top:8px}
  .pinline-add input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .pinline-add input.small{flex:0 0 130px}
  .pinline-add button{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13px}
  .pback{margin-bottom:14px;font-size:13px;color:var(--ink-muted);background:none;padding:4px 0}
  .pback:hover{color:var(--ink)}

  /* Project sub-task badge in calendar */
  .ev.proj{background:var(--surface)}
  .ev.proj::before{content:'▸ ';color:var(--ink-muted);font-weight:400}

  /* Project view mode toggle */
  .pview-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;font-size:12px;margin-right:4px}
  .pview-toggle button{padding:3px 10px;background:none;color:var(--ink-soft);border:none;border-radius:5px;font-weight:500}
  .pview-toggle button:last-child{}
  .pview-toggle button.active{background:var(--surface-2);color:var(--ink);font-weight:600}

  /* Kanban */
  .kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  
  .kcol{background:var(--surface-2);border-radius:8px;padding:8px;min-height:60px;border:1px solid var(--line-soft);transition:outline .12s}
  .kcol-h{font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;padding:0 4px 4px}
  .kcol-h small{font-size:11px;color:var(--ink-muted);font-family:var(--font)}
  .kcol[data-status="doing"] .kcol-h{color:#7a5a30}
  .kcol[data-status="done"] .kcol-h{color:var(--ink-muted)}
  .kcard{background:var(--surface);border-left:3px solid var(--ink-muted);border-radius:4px;padding:7px 10px;margin-bottom:6px;cursor:grab;font-size:13px;line-height:1.3;transition:transform .1s, box-shadow .1s}
  .kcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .kcard:active{cursor:grabbing}
  .kcard.done{opacity:.6;border-left-color:var(--helse)}
  .kcard.done .kcard-title{text-decoration:line-through;color:var(--ink-muted)}
  .kcard-title{font-weight:500;color:var(--ink);word-wrap:break-word}
  .kcard-meta{margin-top:3px;font-size:11px;color:var(--ink-muted)}
  .kcard-meta.overdue{color:var(--alert)}

  /* Outlook synced event style */
  .ev.ics{background:var(--ics-bg);border-left-color:var(--ics-line) !important;opacity:.95}

  /* Multi-day event styling — continuous bar across day-cells within the same week-row.
     Negative margins bleed the bar past the cell's 8px horizontal padding so adjacent
     cells visually connect. Title text only on the first day; continuation cells get
     a transparent placeholder (&nbsp;) so the bar keeps height and aligns vertically. */
  .ev.multi{font-weight:500}
  /* First day in a run: square the right edge, extend right margin into the gap */
  .ev.multi:not(.multi-cont):not(.multi-last){
    margin-right:-9px;
    border-top-right-radius:0;
    border-bottom-right-radius:0;
  }
  /* Continuation day (any day after the first): drop left border, extend left margin */
  .ev.multi.multi-cont{
    margin-left:-9px;
    border-top-left-radius:0;
    border-bottom-left-radius:0;
    border-left:none;
    padding-left:9px;
    color:var(--ink-muted);
  }
  /* Middle of a run (continuation + not last): square right edge too, extend both sides */
  .ev.multi.multi-cont:not(.multi-last){
    margin-right:-9px;
    border-top-right-radius:0;
    border-bottom-right-radius:0;
  }

  /* Week-row boundaries (ADR 0027). A run crossing Sunday→Monday is drawn as one
     labelled segment per row. These rules deliberately sit AFTER the margin-bleed rules
     above: they carry equal specificity, so source order decides, and they win. */
  .ev.multi.multi-rowend:not(.multi-last){
    margin-right:0;
    border-top-right-radius:4px;
    border-bottom-right-radius:4px;
  }
  .ev.multi.multi-rowend:not(.multi-last)::after{
    content:'\203A';           /* › — fortsetter neste uke */
    float:right;
    margin-left:5px;
    color:var(--ink-muted);
    font-weight:400;
  }
  .ev.multi.multi-cont.multi-rowstart{
    margin-left:0;
    padding-left:6px;
    border-top-left-radius:4px;
    border-bottom-left-radius:4px;
    border-left-style:solid;    /* colour comes from the .cat-* rules above */
    border-left-width:3px;
    color:var(--ink);
  }

  /* Project event (project's own day on the calendar) */
  .ev.projevt{background:var(--surface-2);font-weight:500}

  /* Årsoversikt — Gantt timeline */
  .ov-section{margin-bottom:22px}
  .ov-section h3{font-family:var(--font);font-weight:600;font-size:16px;margin:0 0 10px;color:var(--ink)}
  .gantt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .gantt-scroll{overflow-x:auto;overflow-y:hidden}
  .gantt-inner{min-width:900px}
  .gantt-headrow{display:grid;grid-template-columns:160px 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .gantt-headrow .label-col{padding:8px 12px;font-size:11px;color:var(--ink-muted);font-weight:600;letter-spacing:0;}
  .gantt-months{position:relative;height:30px}
  .gantt-months .mtick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft);padding:7px 0 0 4px;font-size:11px;color:var(--ink-muted);font-weight:500;white-space:nowrap}
  .gantt-months .mtick.year-start{border-left-color:var(--line);font-weight:700;color:var(--ink-soft)}
  .gantt-row{display:grid;grid-template-columns:160px 1fr;border-top:1px solid var(--line-soft)}
  .gantt-row .label{padding:8px 12px;font-size:13px;color:var(--ink);border-right:1px solid var(--line-soft);display:flex;align-items:center;cursor:pointer;background:var(--surface)}
  .gantt-row .label:hover{background:var(--surface-2)}
  .gantt-row .label .pcat{width:6px;height:6px;border-radius:50%;background:var(--ink-muted);margin-right:7px;flex-shrink:0}
  .gantt-row .label .pcat.cat-arbeid{background:var(--work)}
  .gantt-row .label .pcat.cat-privat{background:var(--privat)}
  .gantt-row .label .pcat.cat-personlig{background:var(--personlig)}
  .gantt-row .label .pcat.cat-helse{background:var(--helse)}
  .gantt-row .label .pcat.cat-reise{background:var(--reise)}
  .gantt-row .track{position:relative;min-height:36px}
  .gantt-row .track .vline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
  .gantt-row .track .vline.year-start{border-left-color:var(--line)}
  .gantt-row .bar{position:absolute;top:9px;height:18px;border-radius:3px;background:var(--ink-muted);color:var(--surface);font-size:11px;padding:2px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;text-overflow:ellipsis;line-height:1.2;display:flex;align-items:center}
  .gantt-row .bar:hover{filter:brightness(.92);transform:translateY(-1px);transition:transform .12s}
  .gantt-row .bar.cat-arbeid{background:var(--work)}
  .gantt-row .bar.cat-privat{background:var(--privat)}
  .gantt-row .bar.cat-personlig{background:var(--personlig)}
  .gantt-row .bar.cat-helse{background:var(--helse)}
  .gantt-row .bar.cat-reise{background:var(--reise)}
  .gantt-row .bar.point{width:3px;padding:0;border-radius:50%;height:18px;top:9px}
  .today-line{position:absolute;top:0;bottom:0;border-left:2px dashed var(--alert);pointer-events:none;z-index:5}

  /* Key dates list */
  .keydates{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .keydates .kd{padding:10px 16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px}
  .keydates .kd:first-of-type{border-top:none}
  .keydates .kd:hover{background:var(--surface-2)}
  .keydates .kd .kdate{min-width:90px;font-family:var(--font);font-size:14px;color:var(--ink-soft)}
  .keydates .kd .kdate strong{color:var(--ink);font-size:16px;display:block;font-weight:500}
  .keydates .kd .ktitle{flex:1;font-weight:500}
  .keydates .kd .ktitle .meta{display:block;font-size:12px;color:var(--ink-muted);margin-top:1px;font-weight:400}
  .keydates .kd .kcountdown{font-size:12px;color:var(--ink-muted);white-space:nowrap}
  .keydates .kd .kcountdown.urgent{color:var(--alert)}

  /* Animations */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ========== BUTTON SYSTEM ========== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;border:1px solid transparent;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .14s,border-color .14s,color .14s,transform .08s;line-height:1.3;color:var(--ink-soft);background:transparent;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:scale(.97)}
  .btn.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.btn-primary:hover{background:var(--ink);border-color:var(--ink)}
  [data-theme="dark"] .btn.btn-primary{color:#1a1d24}
  .btn.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn.btn-secondary:hover{background:var(--surface-2);border-color:var(--ink-muted)}
  .btn.btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent}
  .btn.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.btn-danger{background:transparent;color:var(--alert);border-color:transparent}
  .btn.btn-danger:hover{background:var(--alert-bg);color:var(--alert)}
  .btn.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
  .btn.btn-lg{padding:10px 20px;font-size:14px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* Icon styling */
  .icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;vertical-align:-2px}
  .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  
  

  
  
  
  
  /* Prevent horizontal scrolling on body */
  html{overflow-x:hidden}

  
  
  
  

  
  

  /* Time-blocked task in day view */
  .day-hours .hslot .ev.task-block{background:var(--surface-2);border-left-style:dashed}
  .day-hours .hslot .ev.task-block::before{content:'☐ ';font-style:normal;color:var(--ink-muted)}
  .day-hours .hslot.drop-target{background:var(--surface-2);outline:2px dashed var(--accent);outline-offset:-2px}
  .day-side .panel li[draggable="true"]{cursor:grab}
  .day-side .panel li[draggable="true"]:active{cursor:grabbing}

  /* Project notes — multi-note cards + rich editor */
  .notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}
  .note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;min-height:90px;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:4px}
  .note-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .note-card-title{font-family:var(--font);font-weight:600;font-size:14px;color:var(--ink);line-height:1.25}
  .note-card-preview{font-size:12px;color:var(--ink-muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .note-card-empty{font-size:12px;color:var(--ink-muted)}
  .new-note-card{background:transparent;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:13px;cursor:pointer;border-radius:var(--radius);min-height:90px}
  .new-note-card:hover{background:var(--surface);color:var(--ink)}
  /* Rich text editor */
  .note-toolbar{display:flex;gap:4px;padding:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
  .note-toolbar button,.note-toolbar select{padding:5px 10px;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--ink);font-family:var(--font);min-width:30px}
  .note-toolbar button:hover,.note-toolbar select:hover{background:var(--surface-2)}
  .note-toolbar .tb-sep{width:1px;background:var(--line);align-self:stretch;margin:0 4px}
  .note-toolbar button.tb-bold{font-weight:700}
  .note-toolbar button.tb-italic{font-style:italic}
  .note-editor{min-height:240px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;outline:none;overflow-y:auto;max-height:60vh}
  .note-editor:focus{border-color:var(--accent)}
  .note-editor h2{font-family:var(--font);font-size:20px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
  .note-editor h3{font-family:var(--font);font-size:16px;font-weight:600;margin:10px 0 4px;color:var(--ink)}
  .note-editor ul,.note-editor ol{margin:6px 0;padding-left:24px}
  .note-editor li{margin:2px 0}
  .note-editor p{margin:6px 0}
  .note-editor a{color:var(--accent);text-decoration:underline}
  .note-editor img{max-width:100%;border-radius:4px;margin:6px 0}
  .note-editor:empty:before{content:attr(data-placeholder);color:var(--ink-muted);pointer-events:none}
  .note-title-input{font-family:var(--font);font-weight:600;font-size:16px;border:none;background:transparent;width:100%;color:var(--ink);outline:none;padding:4px 0;border-bottom:1px dashed var(--line-soft)}
  .note-title-input:focus{border-bottom-color:var(--accent)}
  /* Note modal view mode — clean reading view, hides toolbar + editor borders */
  /* Wikilink-autocomplete (ADR 0026) — flytende liste når du skriver «[[» i et notat.
     z-index over .modal-bg (5000) siden den bor inne i modalen. */
  .wl-ac{position:fixed;z-index:5100;min-width:220px;max-width:330px;max-height:212px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.16);padding:4px;font-size:13px}
  .wl-ac-item{padding:7px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .wl-ac-item[aria-selected="true"]{background:var(--surface-2)}
  .wl-ac-item .wl-ac-cat{float:right;margin-left:12px;font-size:11px;color:var(--ink-muted)}
  .wl-ac-empty{padding:7px 10px;color:var(--ink-muted)}

  [data-note-mode="view"] .note-toolbar{display:none!important}
  [data-note-mode="view"] .note-editor{border:none;padding:0;background:transparent;cursor:pointer;min-height:120px}
  [data-note-mode="view"] .note-title-input{border-bottom:none;font-size:20px;padding:2px 0;cursor:pointer;pointer-events:none}
  [data-note-mode="view"] .note-edit-hint{display:flex}
  [data-note-mode="edit"] .note-edit-hint{display:none}
  .note-edit-hint{display:none;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);padding:8px 0 4px;justify-content:flex-end}
  .toggle-edit-btn{padding:5px 12px;font-size:12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .toggle-edit-btn:hover{background:var(--surface-2)}

  /* Wikilinks */
  .wikilink{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent-soft);padding:0 1px}
  .wikilink:hover{background:var(--surface-2);border-bottom-style:solid}
  .wikilink-broken{color:var(--ink-muted);border-bottom-color:var(--ink-muted)}
  .backlinks{display:flex;flex-direction:column;gap:6px}
  .backlinks .bl{padding:8px 10px;background:var(--surface-2);border-radius:6px;font-size:13px;cursor:pointer;line-height:1.4}
  .backlinks .bl:hover{background:var(--line-soft)}
  .backlinks .bl strong{color:var(--ink);font-size:13px;display:block;margin-bottom:2px}
  .backlinks .bl .snippet{color:var(--ink-muted);font-size:12px}

  /* Markdown preview */
  .md-preview{padding:12px;background:var(--surface-2);border-radius:8px;font-size:14px;line-height:1.55;color:var(--ink)}
  .md-preview h2{margin:8px 0 4px;font-family:var(--font);font-weight:600;font-size:16px;color:var(--ink)}
  .md-preview h3{margin:8px 0 4px;font-family:var(--font);font-weight:600;font-size:15px}
  .md-preview h4{margin:6px 0 2px;font-family:var(--font);font-weight:600;font-size:14px}
  .md-preview p{margin:6px 0}
  .md-preview ul{margin:6px 0;padding-left:20px}
  .md-preview li{margin:2px 0}
  .md-preview img{max-width:100%;border-radius:4px;margin:6px 0;display:block;border:1px solid var(--line-soft)}
  .md-preview a{color:var(--accent);text-decoration:underline}
  .md-preview code{background:var(--surface);padding:1px 4px;border-radius:3px;font-size:90%;font-family:Consolas,monospace}
  .md-preview hr{border:none;border-top:1px solid var(--line);margin:12px 0}

  /* Hjem view */
  .home-greeting{font-family:var(--font);font-size:26px;color:var(--ink);margin:0 0 4px;font-weight:600;letter-spacing:-.025em}
  .home-greeting .day{color:var(--accent)}
  .home-date{font-size:13px;color:var(--ink-muted);margin-bottom:24px}
  .home-date .wr-btn{margin-left:10px;padding:2px 9px;font-size:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .home-section{margin-bottom:32px}
  .home-section > h3{font-family:var(--font);font-weight:600;font-size:14px;margin:0;padding-bottom:8px;border-bottom:1px solid var(--ink);color:var(--ink);letter-spacing:-.005em;display:flex;align-items:center;gap:9px}
  .home-list{background:none;border:none;border-radius:0;overflow:visible}
  .home-list-urgent{background:none;border:none}
  .home-item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 0;margin:0;border-top:1px solid var(--line-soft);cursor:pointer;font-size:14px;transition:background-color .1s}
  .home-item:first-of-type{border-top:none}
  .home-item:hover{background:var(--surface-2)}
  .home-list-urgent .home-item{border-top-color:var(--line-soft)}
  .home-list-urgent .home-item:hover{background:var(--surface-2)}
  .hi-date{flex:0 0 64px;font-family:var(--font);font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hi-date.overdue{color:var(--alert);font-weight:500}
  .hi-title{flex:1;color:var(--ink);line-height:1.35}
  .home-empty{padding:12px 0;color:var(--ink-muted);font-style:normal;font-size:13px;background:none;border:none;border-radius:0}
  .home-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;margin:0}
  .home-item .drag-handle{position:absolute;left:-20px;top:50%;transform:translateY(-50%);color:var(--ink-muted);font-size:11px;cursor:grab;user-select:none;letter-spacing:-2px;width:14px;opacity:0;transition:opacity .12s}
  .home-item:hover .drag-handle{opacity:.8}
  .home-item.dragging{opacity:.4}
  .home-item.drop-before{border-top:2px solid var(--accent)!important;margin-top:-1px}
  .home-item.drop-after{border-bottom:2px solid var(--accent)!important;margin-bottom:-1px}
  /* Generic drag-handle styling for any task row */
  .drag-handle{color:var(--ink-muted);font-size:11px;cursor:grab;user-select:none;letter-spacing:-2px;width:14px;flex-shrink:0;opacity:.5;transition:opacity .12s;display:inline-block}
  /* Draghåndtaket står i venstremargen og vises ved hover (ADR 0056). Før skjøv det
     avkryssingsboksen 26 px inn på rader som kunne dras, og ikke på de andre — så
     Urgent og Uten frist på Hjem startet i hver sin kolonne. */
  .todo-row .drag-handle{position:absolute;left:-20px;top:50%;transform:translateY(-50%);opacity:0}
  .ptask:hover .drag-handle,.todo-row:hover .drag-handle{opacity:.8}
  .ptask.dragging,.todo-row.dragging{opacity:.4}
  .ptask.drop-before,.todo-row.drop-before{border-top:2px solid var(--accent)!important;margin-top:-1px}
  .ptask.drop-after,.todo-row.drop-after{border-bottom:2px solid var(--accent)!important;margin-bottom:-1px}
  .home-item.done .hi-title{text-decoration:line-through;color:var(--ink-muted)}
  /* Prosjekt-tagg som chip (ADR 0035). Erstatter «· Tittel» i kursiv, som leste som en
     fotnote — og fikk prosjektnavnet skrevet inn i tittelen i tillegg. Dempet, men en ting. */
  /* ADR 0058: ikke lenger en tonet pille — prosjektets prikk og navnet, som overskriftene.
     Fargen kommer fortsatt fra --pc-h (ADR 0041), men bare i prikken; teksten er --ink-soft,
     så kontrasten er den samme for alle prosjekter i begge temaer. */
  .proj-chip{display:inline-flex;align-items:baseline;gap:5px;margin-left:8px;padding:0;
    background:none;border:none;color:var(--ink-soft);
    font-size:12px;line-height:1.5;white-space:nowrap;vertical-align:baseline}
  .proj-chip::before{content:"";width:6px;height:6px;border-radius:50%;flex:0 0 6px;align-self:center;
    background:var(--ink-muted)}
  .proj-chip[style*="--pc-h"]::before{background:hsl(var(--pc-h), 38%, 50%)}
  [data-theme="dark"] .proj-chip[style*="--pc-h"]::before{background:hsl(var(--pc-h), 34%, 62%)}
  .todo-row .proj-chip{cursor:pointer}
  .todo-row .proj-chip:hover{color:var(--alert);text-decoration:line-through;text-decoration-thickness:1px}

  /* Week calendar view on Hjem — 7 columns (Mon–Sun) */
  .hjem-week-title{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .hjem-week-title .wn{font-family:var(--font);font-size:14px;color:var(--ink-soft)}
  .hjem-week-title .wn strong{color:var(--ink);font-weight:500;margin:0 4px}
  .hjem-week-title .range{font-size:12px;color:var(--ink-muted)}
  .hjem-week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .hjem-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .hjem-week-col{border-right:1px solid var(--line-soft);min-height:140px;display:flex;flex-direction:column}
  .hjem-week-col:last-child{border-right:none}
  .hjem-week-col.today{background:var(--today)}
  .hjem-week-col.weekend{background:var(--surface-2)}
  .hjem-week-col.today.weekend{background:var(--today)}
  .hjem-week-col-h{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line-soft);background:transparent;position:sticky;top:0}
  .hjem-week-col.weekend .hjem-week-col-h{background:transparent}
  .hjem-week-col-h .wd{font-size:11px;color:var(--ink-muted);letter-spacing:0;display:block;margin-bottom:2px}
  .hjem-week-col-h .num{font-family:var(--font);font-size:16px;color:var(--ink);font-weight:600;display:block;line-height:1}
  .hjem-week-col.today .hjem-week-col-h .num{color:var(--accent)}
  .hjem-week-col-h .hol{font-size:11px;color:var(--alert);font-style:normal;display:block;margin-top:2px;line-height:1.15;word-break:break-word}
  .hjem-week-items{padding:6px;display:flex;flex-direction:column;gap:3px;flex:1;font-size:11px}
  .hjem-week-items .wke{background:var(--surface);border-left:2px solid var(--ink-muted);padding:3px 6px;border-radius:3px;cursor:pointer;line-height:1.3;word-break:break-word;color:var(--ink)}
  .hjem-week-items .wke:hover{filter:brightness(.95)}
  .hjem-week-items .wke strong{font-weight:600;font-size:11px}
  .hjem-week-items .wke.cat-arbeid{border-left-color:var(--work)}
  .hjem-week-items .wke.cat-privat{border-left-color:var(--privat)}
  .hjem-week-items .wke.ics{background:var(--ics-bg);border-left-color:var(--ics-line)}
  [data-theme="dark"] .hjem-week-items .wke.ics{background:#1f2935}
  .hjem-week-items .wke-empty{font-size:11px;color:var(--ink-muted);padding:4px 2px;text-align:center}
  
  
  .home-quick{background:none;border:none;border-radius:0;padding:0;margin-bottom:30px}
  .home-quick input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
  .home-quick .home-quick-hint{font-size:11px;color:var(--ink-muted);margin-top:6px}

  /* Task completion animation */
  .todo-row.completing,.ptask.completing,.kcard.completing,.tasks-block li.completing{animation:taskComplete 380ms ease-out forwards}
  @keyframes taskComplete{
    0%{opacity:1;transform:translateX(0)}
    50%{opacity:.5;transform:translateX(8px)}
    100%{opacity:0;transform:translateX(40px);max-height:0;padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;border:0}
  }

  /* Today dashboard */
  .dashboard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  
  .dashboard h4{margin:0 0 8px;font-family:var(--font);font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
  .dashboard .dash-item{padding:4px 0;font-size:13px;color:var(--ink-soft);display:flex;gap:8px;align-items:flex-start;line-height:1.35;cursor:pointer;border-top:1px solid var(--line-soft)}
  .dashboard .dash-item:first-of-type{border-top:none}
  .dashboard .dash-item:hover{color:var(--ink)}
  .dashboard .dash-item .ddate{min-width:48px;color:var(--ink-muted);font-family:var(--font);font-size:12px;flex-shrink:0}
  .dashboard .dash-item .dtitle{flex:1}
  .dashboard .dash-item .dtitle .dmeta{display:block;font-size:11px;color:var(--ink-muted);margin-top:1px}
  .dashboard .dash-urgent h4{color:var(--alert)}
  .dashboard .dash-empty{font-size:12px;color:var(--ink-muted);padding:4px 0}

  /* Priority pills + To Do's view */
  .pill.prio-urgent{--dot:var(--pri-urgent);color:var(--ink-soft)}
  .pill.prio-short{--dot:var(--pri-short);color:var(--ink-soft)}
  .pill.prio-long{--dot:var(--pri-long);color:var(--ink-soft)}
  .pill.prio-none{--dot:var(--line);color:var(--ink-muted)}
  .todo-quick{background:none;border:none;border-radius:0;padding:0;margin-bottom:30px;display:flex;flex-direction:column;gap:10px}
  /* Uten eksplisitt bakgrunn arver feltet nettleserens hvite standard, mens teksten
     følger --ink. I mørk modus ble det lys tekst på hvitt — praktisk talt usynlig. */
  .todo-quick input.qtxt{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
  .todo-quick .qbtns{display:flex;gap:6px;flex-wrap:wrap}
  .todo-quick .qbtns button,
  .todo-quick .qbtns select{padding:6px 10px;font-size:13px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .todo-quick .qbtns button.urgent{background:var(--surface);border-color:var(--line);color:var(--ink-soft);--dot:var(--pri-urgent)}
  .todo-quick .qbtns button.short{background:var(--surface);border-color:var(--line);color:var(--ink-soft);--dot:var(--pri-short)}
  .todo-quick .qbtns button.long{background:var(--surface);border-color:var(--line);color:var(--ink-soft);--dot:var(--pri-long)}
  .todo-quick .qbtns button:hover{border-color:var(--ink-muted);color:var(--ink)}
  .todo-bucket{background:none;border:none;border-radius:0;margin:0 0 30px;overflow:visible}
  .todo-bucket .bh{padding:0 0 8px;background:none;font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:-.005em;display:grid;grid-template-columns:7px auto 1fr auto;column-gap:9px;row-gap:2px;align-items:center;color:var(--ink);border-bottom:1px solid var(--ink)}
  .todo-bucket .bh small{grid-column:4;font-size:12px;color:var(--ink-muted);font-weight:400;font-family:var(--font);font-style:normal;justify-self:end;text-align:right;font-variant-numeric:tabular-nums}
  .todo-bucket .bh .bh-hint{grid-column:3;justify-self:end;font-size:12px;font-weight:400;color:var(--ink-muted);text-align:right;padding-right:6px}
  .todo-bucket .bh.urgent{background:none;color:var(--ink);--dot:var(--pri-urgent)}
  .todo-bucket .bh.short{background:none;color:var(--ink);--dot:var(--pri-short)}
  .todo-bucket .bh.long{background:none;color:var(--ink);--dot:var(--pri-long)}
  .todo-row{position:relative;padding:10px 0;margin:0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;font-size:14px;transition:background-color .1s}
  .todo-row:first-of-type{border-top:none}
  .todo-row.done .ttitle{text-decoration:line-through;color:var(--ink-muted)}
  .todo-row .ttitle{flex:1;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0}
  /* Dato og prosjekt-chip skal ikke krympe eller brytes — det er tittelen som skal ta
     plassen. Uten `flex-shrink:0` klemte flex-oppsettet chipen til «Meox …». ADR 0035. */
  .todo-row .ttitle .due{font-size:12px;color:var(--ink-muted);flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* Forfalt frist. Ordene bærer det alene («2 dager på overtid»), men fargen fanger
     blikket først når lista er lang. ADR 0040. */
  .todo-row .ttitle .due.overdue{color:var(--alert);font-weight:500}
  .todo-row .ttitle > .proj-chip{flex:0 0 auto}

  /* Velg-modus og handlingslinje (ADR 0042) */
  .todo-row.selectable{cursor:pointer}
  .todo-row.selectable:hover{background:var(--surface-2)}
  .todo-row.selected{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
  .todo-row .selbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .bulkbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    margin:0 0 12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow)}
  .bulkbar .bb-count{font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
  .bulkbar .bb-hint{font-size:12px;color:var(--ink-muted)}
  .bulkbar .bb-field{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft)}
  .bulkbar button,.bulkbar select,.bulkbar input{padding:5px 10px;font-size:13px;border-radius:6px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .bulkbar button{cursor:pointer}
  .bulkbar button:hover{background:var(--surface-2);color:var(--ink)}
  .bulkbar button.danger{color:var(--alert);border-color:var(--alert-bg)}
  .bulkbar button.danger:hover{background:var(--alert-bg)}
  .bulkbar .bb-cancel{margin-left:auto}
  
  .todo-row .actions{display:flex;gap:3px;align-items:center;opacity:0;transition:opacity .12s}
  .todo-row:hover .actions{opacity:1}
  .todo-row .actions button{padding:3px 7px;font-size:11px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .todo-row .actions button:hover{background:var(--surface-2)}
  .todo-row .actions .ag{color:var(--ink-muted);border-color:transparent}
  .todo-row .actions .ag:hover{color:var(--ink)}
  .todo-row .actions .ag[data-action^="delete"]:hover{color:var(--alert)}
  .todo-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:0 0 16px;margin:0;border:1.5px solid color-mix(in srgb,var(--ink-muted) 70%,transparent);border-radius:4px;background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background-color .12s,border-color .12s}
  .todo-empty{padding:11px 0;color:var(--ink-muted);font-style:normal;font-size:13px;text-align:left}
  /* «Fra prosjekter»-bøtta (ADR 0045). Dempet overskrift — den skal ikke konkurrere med
     Urgent/Short/Long, som er hennes egen prioritering. Gruppeoverskriften bærer
     prosjektets farge fra --pc-h (ADR 0041), så raden kjennes igjen fra kortet. */
  .todo-bucket .bh.proj{background:none;color:var(--ink);--dot:var(--pri-proj)}
  .proj-bucket .ptgroup + .ptgroup{border-top:none}
  .ptgroup-head{display:flex;align-items:center;gap:8px;padding:16px 0 6px;cursor:pointer;background:none;
    border-top:none;box-shadow:none;--pc-c:hsl(var(--pc-h, 220), 38%, 50%)}
  .ptgroup-head::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc-c);flex:0 0 8px}
  .ptgroup-head:hover .ptgroup-name{text-decoration:underline;text-underline-offset:3px}
  .ptgroup-head .ptgroup-name{font-size:13px;font-weight:600;letter-spacing:0;color:var(--ink)}
  .ptgroup-head .ptgroup-count{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  [data-theme="dark"] .ptgroup-head{--pc-c:hsl(var(--pc-h, 220), 34%, 62%)}

  /* Prosjektoppgaverader har to handlinger, ikke ni — de skal ikke hoppe i bredden. */
  .ptodo-row .actions{min-width:0}
  .ptodo-row.done .ttitle{text-decoration:line-through;color:var(--ink-muted)}
  .lrow.ics .ldate{opacity:.7}
  .pill.ics{--dot:var(--ics-line)}
  .sync-status{font-size:12px;color:var(--ink-muted)}
  .sync-status.error{color:var(--alert)}
  .sync-status.ok{color:#588a58}

  /* Tasks list */
  .tasks-block ul{list-style:none;margin:0;padding:0}
  .tasks-block li{padding:6px 0;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-size:13px}
  .tasks-block li:first-of-type{border-top:none}
  .tasks-block li.done .tt{text-decoration:line-through;color:var(--ink-muted)}
  .tasks-block .tt{flex:1}
  .tasks-block .due{font-size:11px;color:var(--ink-muted)}
  .tasks-block input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}

  /* ====== Utility classes (consolidated from repeated inline styles, added 2026-05-26) ====== */
  .text-alert{color:var(--alert)}
  .text-muted-sm{font-size:12px;color:var(--ink-muted)}
  .text-muted-italic{font-size:12px;color:var(--ink-muted)}
  .text-note{font-weight:400;color:var(--ink-muted);text-transform:none;letter-spacing:0}
  .text-mute-small{color:var(--ink-muted);font-size:11px}
  .btn-sec{padding:6px 12px;font-size:13px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:border-color .12s,color .12s}
  .btn-sec-lg{padding:8px 14px;font-size:13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .btn-sec-xs{padding:3px 7px;font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
  .btn-action{padding:7px 12px;border-radius:6px;border:1px solid var(--line);font-size:13px}
  .flex-row-gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .flex-col-stretch{flex-direction:column;align-items:stretch;gap:6px}
  .section-break{padding:10px 0;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
  .section-title{font-family:var(--font);font-weight:600;font-size:14px;margin-bottom:8px;letter-spacing:-.005em}
  .input-mono{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:monospace;margin-bottom:8px}
  .input-overlay{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .pos-rel-ib{position:relative;display:inline-block}

  /* ============================================================ */
  /* ALLE MEDIA-SPØRRINGER LIGGER SIST (ADR 0046)                 */
  /* ============================================================ */
  /* Media-blokkene lå før spredt ut over hele arket, og alt som ble deklarert
     ETTER dem vant ved samme spesifisitet — uansett hva media-spørringen sa.
     Det gjorde regler døde i månedsvis uten et eneste varsel: handlingsknappene
     i To Do-radene var usynlige på iPhone men tok fortsatt 126 px høyde i hver
     rad, og draghåndtaket sto der på touch hvor HTML5-dra ikke virker (ADR 0044).
     ADR 0044 lappet symptomet ved å legge én blokk nederst. Dette er kuren:
     alle 19 media-blokkene ligger nå her, i sin opprinnelige innbyrdes
     rekkefølge, etter samtlige basisregler. En basisregel kan ikke lenger
     overkjøre en media-regel ved et uhell.
     REGELEN: nye media-spørringer skrives HER, aldri oppe i arket. */

/* Delmålsrad i «Fra prosjekter» (ADR 0054). Bevisst ulik en oppgaverad: romben sier
   at dette er en markering av framdrift, ikke arbeid noen skal utføre. Fargen er
   --ink-muted, ikke --accent — den skal ikke konkurrere med oppgavene over. */
.todo-row.ms-row .ms-mark{ color:var(--ink-muted); font-size:11px; flex:0 0 auto; margin-right:2px }
.todo-row.ms-row .ttitle{ cursor:pointer }
.todo-row.ms-row.done .ms-mark{ opacity:.5 }
/* I velg-modus står delmålene der uten avkryssingsboks — de kan ikke masseredigeres.
   Innrykket erstatter boksen så titlene fortsatt står i linje med oppgavene over. */
.todo-row.ms-row:not(:has(input)) { padding-left:calc(var(--sp,10px) + 22px) }

/* Stjernemerking og «I dag» (ADR 0055).
   Stjernemerkede rader sorteres IKKE om — de blir staaende og fremheves der de er.
   Markeringen er tredelt med vilje: en kantstripe fanger blikket naar man skummer
   kolonnen, bakgrunnen holder den fremhevet mens man leser raden, og stjernen foran
   tittelen baerer betydningen for den som ikke ser farger. */
.todo-row.starred{
  background:var(--star-bg);
  /* ADR 0056: radene har ikke lenger egen polstring, så en innvendig stripe ville ligget
     oppå avkryssingsboksen. Flaten forlenges 8 px ut på hver side, og stripen står ytterst
     til venstre — utenfor tekstkolonnen, som draghåndtaket. Første skygge ligger øverst. */
  box-shadow:-8px 0 0 var(--star-bg), -11px 0 0 var(--star), 8px 0 0 var(--star-bg);
}
.todo-row.starred:hover{
  background:var(--surface-2);
  box-shadow:-8px 0 0 var(--surface-2), -11px 0 0 var(--star), 8px 0 0 var(--surface-2);
}
.todo-row.starred + .todo-row.starred{ border-top-color:var(--star-line) }
.todo-row .star-mark{ color:var(--star); font-size:12px; flex:0 0 auto }
.todo-row.done.starred{ background:none; box-shadow:none }   /* gjort = ikke lenger noe aa prioritere */
.todo-row.done .star-mark{ opacity:.45 }
/* Stjerneknappen i handlingsraden. Kant og bakgrunn arves fra `.actions button`;
   her settes bare farge og bredde, slik at ☆ og ★ ikke gir raden to ulike bredder. */
.todo-row .actions .star-btn{ color:var(--ink-muted); min-width:26px; text-align:center; line-height:1 }
.todo-row .actions .star-btn.on{ color:var(--star); border-color:var(--star-line) }
.todo-row .actions .star-btn:hover{ color:var(--star) }
.todo-row .actions .idag-btn{ white-space:nowrap }
/* Datochipen er «sett til i dag» der knappen ikke får plass — se telefonblokka.
   Affordansen vises bare på telefon: på desktop står den ekte knappen, og en stiplet
   strek under datoen der ville vært to måter å si det samme på. */
.todo-row .due-tap{ cursor:pointer }


/* ===== Designsystemet — komponenttillegg (ADR 0056) =====================
   Reglene over er skrevet om på stedet. Her står bare det som ikke fantes:
   prikkene som erstatter de fargefylte overskriftene, fokusringer, og den
   tegnede avkryssingsboksen for PC (telefonens ligger i 700 px-blokka). */

/* Prioritet/kategori som en liten prikk. `--dot` settes av regelen over. */
.todo-bucket .bh::before,
.todo-quick .qbtns button.urgent::before,.todo-quick .qbtns button.short::before,.todo-quick .qbtns button.long::before,
.pill::before,
.home-section > h3.hs-dot::before{
  content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--dot,var(--pri-proj));flex:0 0 7px}
.todo-quick .qbtns button.urgent::before,.todo-quick .qbtns button.short::before,.todo-quick .qbtns button.long::before{
  margin-right:7px;vertical-align:1px}
.todo-bucket .bh:not(.urgent):not(.short):not(.long):not(.proj){--dot:var(--ink-muted)}
.todo-bucket .bh + .todo-row,.todo-bucket .bh + .ptgroup,.home-section > h3 + .home-list .home-item:first-child{border-top:none}
.home-section > h3.hs-dot.urgent{--dot:var(--pri-urgent)}
.home-section > h3.hs-dot.today{--dot:var(--ink)}
.home-section > h3.hs-dot.none{--dot:var(--line)}
.home-section > h3.hs-dot.cal{--dot:var(--ics-line)}
/* «+N til uten frist» står i tittelkolonnen (avkryssing 16 + 12 + dato 64 + 12) og tar deg til To Do's */
.home-item.hi-more-row{padding-left:104px}
.home-item.hi-more-row .hi-more{color:var(--ink-soft)}
.home-item.hi-more-row:hover .hi-more{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.home-section > h3 small,.home-section > h3 .hs-note{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink-muted);font-variant-numeric:tabular-nums}

/* Raden: hover som en svak flate, ikke en ramme */
/* Hover-flaten stikker 8 px ut på hver side med skygge, ikke marg — da står
   radstrekene i linje med overskriftens strek, og ingenting flytter seg. */
.todo-row:hover,.home-item:hover,.home-list-urgent .home-item:hover{background:var(--surface-2);box-shadow:-8px 0 0 var(--surface-2),8px 0 0 var(--surface-2)}
.todo-row .ttitle{font-size:14px;line-height:1.45;color:var(--ink)}

/* Avkryssingsboks, PC. Samme tegning som telefonens (ADR 0051), mindre. */
.todo-row input[type=checkbox]::before,.home-item input[type=checkbox]::before,.ptask input[type=checkbox]::before{
  content:"";width:9px;height:5px;border:solid transparent;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.todo-row input[type=checkbox]:checked,.home-item input[type=checkbox]:checked,.ptask input[type=checkbox]:checked{
  background:var(--ink);border-color:var(--ink)}
.todo-row input[type=checkbox]:checked::before,.home-item input[type=checkbox]:checked::before,.ptask input[type=checkbox]:checked::before{
  border-color:var(--surface)}
.home-item input[type=checkbox],.ptask input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:0 0 16px;margin:0;
  border:1.5px solid color-mix(in srgb,var(--ink-muted) 70%,transparent);border-radius:4px;background:var(--surface);
  display:grid;place-content:center;cursor:pointer;transition:background-color .12s,border-color .12s}
.todo-row input[type=checkbox]:hover,.home-item input[type=checkbox]:hover,.ptask input[type=checkbox]:hover{border-color:var(--ink)}

/* Fokus: synlig for tastatur, usynlig for mus */
:where(button,select,input,textarea,[data-action]):focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--radius-sm)}
.todo-quick input.qtxt:focus,.home-quick input:focus,
.modal .field input:focus,.modal .field select:focus,.modal .field textarea:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 9%,transparent)}
.btn-sec:hover{border-color:var(--ink-muted);color:var(--ink)}
.nav button:hover{color:var(--ink)}

/* Prosjektkort: tittelen understrekes ved hover i stedet for at kortet hopper */

/* Tall som skal stå i kolonne */
.due,.ptodo-date,.hi-date,.pcount,.ptgroup-count,.badge{font-variant-numeric:tabular-nums}
body{font-feature-settings:"cv11","ss01","tnum" 0;letter-spacing:-.003em}


/* ===== Prosjekter (ADR 0057) =============================================
   Rutenett trenger kanter. Uten ramme fløt kortene som løse kolonner med en farget
   strek over — i en liste holder overskrift + strek gruppene sammen, i to dimensjoner
   gjør de det ikke. Kortet er derfor en hvit flate med hårfin ramme og 10 px hjørner,
   uten fyll og uten skygge i ro. */
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;min-width:0}
.pc-titles{min-width:0;flex:1}
.pc-dot{width:8px;height:8px;border-radius:50%;background:var(--pc-c,var(--ink-muted));flex:0 0 8px;transform:translateY(-1px)}
.pcard .pmeta .pill::before{display:none}
.pcard .pmeta .pill{color:var(--ink-muted);font-weight:400}
.pcard .pmeta > * + *::before{content:"·";margin-right:10px;color:var(--line)}
.pcard .countdown.urgent{color:var(--alert)}
.pcard .countdown.empty{font-size:12px;font-weight:400;color:var(--ink-muted)}
.pcard .countdown.empty small{margin-top:0}
.pc-prog{display:flex;align-items:center;gap:12px;min-width:0}
.pcard .pstats span strong{color:var(--ink);font-weight:600}
.pcard.archived{opacity:.7}
/* Prosjektsiden */
.pdetail .phead .pmeta{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.pdetail .phead .pmeta .pm-soft{color:var(--ink-muted)}
.pdetail .phead .pcount.past{color:var(--ink-muted)}
.pdetail .phead .pcount.empty{font-size:13px;font-weight:400;color:var(--ink-muted)}
.psection h4 + .ptask,.psection h4 + div > .ptask:first-child{border-top:none}
.ptask:hover{background:var(--surface-2);box-shadow:-8px 0 0 var(--surface-2),8px 0 0 var(--surface-2)}
.ptask:hover .ptdel{opacity:1}
.ptask .ptdel:hover{color:var(--alert)}
.ptask .drag-handle{position:absolute;left:-20px;top:50%;transform:translateY(-50%);opacity:0}
.pview-toggle button:hover{color:var(--ink)}


/* ===== Andre gjennomgang (ADR 0057) ===================================== */
/* Prioritet som prikk, overalt. Samme farger som bøtteoverskriftene rett under, så
   knappen forklarer seg selv uten å måtte lære ⚠ ↗ ⤳. Ordet står ved siden av der det
   er plass (innboksen på PC); ellers bærer tittelen det. */
.prio-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;--dot:var(--ink-muted)}
.prio-btn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot);flex:0 0 8px}
.prio-btn.urgent{--dot:var(--pri-urgent)} .prio-btn.short{--dot:var(--pri-short)} .prio-btn.long{--dot:var(--pri-long)}
.prio-btn.none::before{background:none;box-shadow:inset 0 0 0 1.5px var(--ink-muted)}
.prio-btn:not(:has(.pb-l)){min-width:26px}
.todo-row .actions .prio-btn{padding:4px 7px}
.todo-row[data-task-kind="inbox"] .actions .prio-btn{padding:4px 10px;font-size:12px;color:var(--ink-soft)}
/* Kategori i innboksen: ordet, ikke en blå prikk som ligner prioritetsprikkene ved siden av */
.todo-row .actions .cat-btn{font-size:12px;color:var(--ink-soft);padding:4px 10px}
.todo-row .actions .cat-btn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--work)}
.todo-row .actions .cat-btn.privat::before{background:var(--privat)}
/* Hjem: aktive prosjekter som liste */
.home-projects .hp-row{gap:12px}
.home-projects .hi-title{display:flex;gap:12px;align-items:baseline;min-width:0;flex:1 1 auto}
.home-projects .hp-next{max-width:100%}
.home-projects .hp-name{font-weight:500;color:var(--ink);white-space:nowrap}

    /* List rows — bigger touch targets */

    .home-item .drag-handle { display: none; } /* drag handles hidden on touch */
    .home-item.hi-more-row { padding-left: 50px; } /* 16 + avkryssing 22 + 12 */

    .hjem-week-grid {

    /* To Do's */

    /* Fire prioriteter på én rad, prosjekt og tale på neste: to rader i stedet for tre

    .todo-quick .qbtns { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
    .todo-quick .qbtns button,

    .todo-quick .qbtns button.urgent::before,.todo-quick .qbtns button.short::before,.todo-quick .qbtns button.long::before{display:none}

  /* ============================================================ */
