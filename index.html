       åpner — ett trykk unna — og for flere rader samtidig finnes velg-modus (ADR 0042).
       Ni kontroller per rad ga tre skjermer med rulling for fire oppgaver.
       `:not(inbox)` framfor å liste opp typer: innboksen er unntaket, ikke regelen. */
    .todo-row:not([data-task-kind="inbox"]) .actions{
      opacity:1; flex:0 0 auto; padding-left:0; gap:4px; justify-content:flex-end}
    .todo-row:not([data-task-kind="inbox"]) .actions > *{display:none}
    /* ADR 0050 skar raden ned fra ni kontroller til én, og det var riktig. Stjernen
       slipper likevel gjennom — den er BÅDE kontrollen og markeringen, og ett trykk.
       «I dag» gjør det ikke, og det er målt, ikke ment: en fri To Do har alt ✎ og ×
       i handlingsraden på telefon, så stjernen er den tredje knappen. Med «I dag» som
       den fjerde falt tittelen fra 150 til 98 px og median radhøyde steg 80 → 101 px.
       «I dag» ligger i stedet på selve datochipen, som koster null bredde. ADR 0055.
       Endrer du dette: mål tittelbredden og radhøyden på 390 px først. */
    .todo-row:not([data-task-kind="inbox"]) .actions > .ag,
    .todo-row:not([data-task-kind="inbox"]) .actions > .star-btn{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:40px; min-height:40px; font-size:16px}
    .todo-row:not([data-task-kind="inbox"]) .actions > .idag-btn{ display:none }
    /* Stjernen foran tittelen ble en egen linje på telefon (tittelen er et flex-element som
       wrapper som helhet). Her viser stjerneknappen rett ved siden av allerede ★ fylt, så
       merket er overflødig — stripe, flate og knapp bærer det (ADR 0056). */
    .todo-row:not([data-task-kind="inbox"]) .star-mark{ display:none }
    .todo-row .due-tap{ text-decoration:underline dotted; text-underline-offset:3px }
    .todo-row.done .due-tap{ text-decoration:none }
    /* ✎ er ikke destruktiv. `.ag` farget begge røde, og på telefonen — der de er de
       eneste knappene — leste blyanten som en slett-knapp nummer to. */
    .todo-row:not([data-task-kind="inbox"]) .actions > .ag[data-action="openTaskForm"],
    .todo-row:not([data-task-kind="inbox"]) .actions > .ag[data-action="openProjectTaskForm"]{color:var(--ink-soft)}
    /* Fast tre-kolonners rad: avkryssing | tittel | ✎ ×. Med `flex-wrap:wrap` på raden
       dyttet en lang tittel seg selv ned på ny flex-linje og etterlot avkryssingsboksen
       alene øverst og knappene på en tredje linje — 134 px for én oppgave. Tittelen får
       wrappe internt i stedet, så dato og prosjekt-chip legger seg under teksten. */
    .todo-row:not([data-task-kind="inbox"]){flex-wrap:nowrap; align-items:flex-start}
    .todo-row:not([data-task-kind="inbox"]) input[type=checkbox]{margin-top:2px}
    .todo-row:not([data-task-kind="inbox"]) .ttitle{
      flex:1 1 auto; min-width:0; flex-wrap:wrap; row-gap:2px; align-items:baseline}
    /* Innboksen beholder hele knapperaden: der ER trikset å sortere med ⚠ ↗ ⤳. */
    .todo-row[data-task-kind="inbox"] .actions{opacity:1}
    /* Før: tre linjer med knapper under tittelen, 170 px for én innboksrad. Nå: tittelen
       over, én linje med handlinger under — prosjektvalget tar plassen som er igjen. */
    .todo-row[data-task-kind="inbox"]{flex-wrap:wrap; row-gap:8px}
    .todo-row[data-task-kind="inbox"] .ttitle{flex:1 1 100%}
    .todo-row[data-task-kind="inbox"] .actions{flex:1 1 100%; flex-wrap:wrap; gap:6px; padding-left:0; justify-content:flex-start}
    .todo-row[data-task-kind="inbox"] .actions select{flex:1 1 140px; min-width:0}
    .todo-row[data-task-kind="inbox"] .actions .prio-btn .pb-l{display:none}
    .home-projects .hi-title{flex-direction:column;gap:1px}
    .home-projects .hp-name{white-space:normal}
    /* Draghåndtak er en død kontroll på touch. */
    .ptask .drag-handle, .todo-row .drag-handle, .home-item .drag-handle{display:none}
    /* Bøtteoverskriften er `justify-content:space-between` på én linje. På 390 px la den
       lange hjelpeteksten seg oppå selve overskriften — «Innboks» og «1 ufordelte …»
       overlappet. `wrap` framfor `column`: rene tall («4») blir stående på samme linje,
       bare de lange hjelpetekstene faller ned. */
    .todo-bucket .bh{flex-wrap:wrap; gap:2px 10px}
    .todo-bucket .bh{grid-template-columns:7px 1fr auto}
    .todo-bucket .bh small{grid-column:3}
    .todo-bucket .bh .bh-hint{grid-row:2; grid-column:2 / -1; justify-self:start; text-align:left; padding-right:0}
    /* «Legg til»-radene på prosjektsiden er én flex-linje uten wrap. På 390 px ble
       datofeltet, url-feltet og rollefeltet klippet av den høyre kanten — og siden en
       forelder har overflow:hidden vokste ikke dokumentet, så en ren scrollWidth-måling
       fanget det ikke. Hvert felt får egen linje. */
    .pinline-add{flex-wrap:wrap}
    .pinline-add input, .pinline-add input.small{flex:1 1 100%; min-width:0}
    .pinline-add button{flex:1 1 100%; min-height:40px}
  }

  /* ADR 0058: på PC med mus holdt knapperaden av 618 px i hver rad også når den var
     usynlig (opacity 0), så titlene ble brutt etter halv bredde. Nå står den utenfor
     flyten og legger seg over høyre ende av raden ved hover og tastaturfokus, med en
     myk overgang fra radflaten. Innboksen (alltid synlige knapper) og berøringsskjermer
     beholder den vanlige raden. */
  @media (hover: hover) and (min-width: 701px){
    .todo-row{--row-bg:var(--bg)}
    .todo-row.starred{--row-bg:var(--star-bg)}
    .todo-row:hover,.todo-row.starred:hover{--row-bg:var(--surface-2)}
    .todo-row:not([data-task-kind="inbox"]) > .actions{
      position:absolute;top:0;bottom:0;right:0;z-index:1;padding-left:36px;
      background:linear-gradient(90deg, transparent 0, var(--row-bg) 32px)}
    .todo-row:not([data-task-kind="inbox"]):focus-within > .actions{opacity:1}
    .todo-row:not([data-task-kind="inbox"]) .actions .prio-btn .pb-l{display:inline}
    .todo-row:not([data-task-kind="inbox"]) .actions .prio-btn{padding:4px 9px;font-size:12px;color:var(--ink-soft)}
    .todo-row .actions select[onchange*="taskToProject"]{max-width:130px}
  }

  /* ============================================================ */
  /* MOBILMODELLEN (ADR 0050)                                        */
  /* ============================================================ */
  /* Én modell for telefon, ikke femti småfikser: rammen krymper til to smale bånd
     (topplinje på én rad, bunnmeny som tab-bar), innholdet tilpasser seg tommelen
     (44 px berøringsmål, 12 px skriftgulv, ingen fylte fargebokser). Måned er en
     minikalender med prikker, Uke er en agenda (tegnes av _renderWeekAgenda i app.js).
     Ligger sist i arket, som ADR 0046 krever. */
  @media (max-width: 700px){

    /* ---- Rammen ---- */
    /* Bunnmenyen bor INNE i den klebrige topplinja. Med z-index:10 ble hele den
       konteksten tegnet under alt innhold med høyere z — hendelser i Uke og Dag har
       1–99 — så møtene la seg over menyen. 300 ligger over alt innhold, under modalen (5000). */
    header.topbar{
      z-index:300; flex-wrap:nowrap; gap:6px; min-height:52px;
      padding:6px 12px; padding-top:calc(6px + env(safe-area-inset-top, 0px));
    }
    .brand{order:1; flex:0 1 auto; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .brand .dot{width:6px; height:6px; margin-right:6px}
    .topbar-spacer{display:none}
    .filter{order:2; flex:1 1 130px; min-width:130px; max-width:210px; margin:0 auto; padding:2px}
    .filter button{flex:1; padding:0 6px; font-size:13px; font-weight:500; border-radius:6px}
    .top-actions{order:3; flex:0 0 auto; gap:0}
    .icon-btn{width:40px; height:40px}

    .nav{
      padding:3px 6px calc(4px + env(safe-area-inset-bottom, 0px));
      gap:0; box-shadow:none; border-top:1px solid var(--line); background:var(--surface);
      justify-content:stretch; overflow:visible;
    }
    .nav button{
      flex:1 1 0; min-width:0; min-height:46px; padding:9px 0 6px;
      font-size:12px; font-weight:500; line-height:1.2; border-radius:10px; position:relative;
      letter-spacing:-.1px; color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .nav button.active{background:transparent; color:var(--ink); font-weight:600; box-shadow:none}
    [data-theme="dark"] .nav button.active{color:var(--ink)}
    .nav button.active::before{
      content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:22px; height:2px; border-radius:2px; background:var(--accent);
    }
    .nav button .badge{font-size:11px; padding:1px 4px; margin-left:3px; vertical-align:1px}

    /* Innholdet skal aldri ende under menyen, og FAB-en skal ikke ligge på den. */
    main{padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))}
    .fab{bottom:calc(76px + env(safe-area-inset-bottom, 0px)); right:16px; width:52px; height:52px}

    /* ---- Skriftgulv: ingenting under 12 px på telefon ----
       Målt: 36 forfallsdatoer på 11 px, 21 månedsmerker på 10,5, kategoripiller på 10.
       Løftes ett hakk hver — ikke til én felles størrelse, hierarkiet skal stå. */
    .pcard .ptodo{font-size:13px}
    .todo-row .ttitle .due, .tasks-block .due, .ptask .due,
    .search-results .sr .meta, .keydates .kd .ktitle .meta,
    .strip .label, .gantt-headrow .label-col, .ptgroup-head .ptgroup-count,
    .text-mute-small, .hjem-week-col-h .wd,
    .gantt-months .mtick, .hjem-week-items .wke-empty, .nav button .badge{font-size:12px}
    .pill{font-size:12px; letter-spacing:.4px}
    .todo-bucket .bh small, .home-section small, .psection small, .pcard small{font-size:12px}
    .gantt-row .bar{height:24px; line-height:24px; font-size:12px}
    .gantt-row .label{font-size:13px}
    .hjem-week-items .wke strong{font-size:12px}
    .home-date .wr-btn{font-size:13px; min-height:32px; padding:0 10px}
    .home-quick-hint span{font-size:13px}
    .pcard .ptodo-more .ptodo-title{font-size:12px}
    .pcard .ptodo-date{flex-basis:72px}
    .week .hour-label, .day-hours .hl{font-size:12px}
    .todo-bucket .bh small{font-size:13px}
    .home-quick-hint{font-size:13px}
    .proj-chip{font-size:12px}
    .month-grid .row.head .cell{font-size:12px}

    /* ---- Undernavigasjon (I dag · tittel · ‹ ›) på én rad ---- */
    .subnav:has(.arrows){display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; margin-bottom:10px}
    .subnav:has(.arrows) h2{font-size:20px; line-height:1.2; text-align:center; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .subnav:has(.arrows) h2 .yr{display:block; font-size:13px; margin:1px 0 0; white-space:nowrap}
    .subnav .today-btn{min-height:40px; padding:0 12px; font-size:13px}
    .subnav .arrows button{width:40px; height:40px}

    /* ---- Prosjekter: kortene kan ikke sprenge bredden ----
       `1fr` er `minmax(auto,1fr)`, og auto-minimum er innholdets minste bredde — en
       nowrap-tittel på 518 px gjorde hele siden 652 px bred, og bunnmenyen forsvant ut
       av bildet. minmax(0,1fr) er den kanoniske kuren. */
    .projects-grid{grid-template-columns:minmax(0,1fr); gap:10px}
    .pcard{min-width:0; padding:14px 16px 16px; border-radius:10px}
    .pcard h3{font-size:15px}

    /* ---- Måned: minikalender ----
       Sju like kolonner. Hver hendelse er én prikk i kategorifargen, «+N til» en grå
       prikk. Trykk på dagen åpner Dag — renderMonth har alltid gjort det. */
    .month-grid .row.head .cell{padding:8px 0; text-align:center; letter-spacing:.3px}
    .month-grid .cell{
      min-height:60px; padding:5px 3px 7px;
      flex-direction:row; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:3px;
    }
    .month-grid .cell .num{width:100%; justify-content:center; font-size:14px; font-weight:500; height:24px; margin-bottom:1px}
    .month-grid .cell.today .num{color:var(--accent); font-weight:700}
    .month-grid .cell .num .holiday-tag{display:none}
    .month-grid .cell:has(.holiday-tag) .num{color:var(--alert)}
    .month-grid .cell .ev,
    .month-grid .cell .more,
    .month-grid .cell .ev.multi,
    .month-grid .cell .ev.multi.multi-cont,
    .month-grid .cell .ev.multi:not(.multi-cont):not(.multi-last),
    .month-grid .cell .ev.multi.multi-cont:not(.multi-last),
    .month-grid .cell .ev.multi.multi-rowend:not(.multi-last),
    .month-grid .cell .ev.multi.multi-cont.multi-rowstart{
      width:6px; height:6px; min-height:0; flex:0 0 6px;
      padding:0; margin:0; border:none; border-radius:50%;
      font-size:0; line-height:0; color:transparent; overflow:hidden; box-shadow:none;
      background:var(--ink-muted);
    }
    .month-grid .cell .ev::before, .month-grid .cell .ev::after{content:none}
    .month-grid .cell .ev.cat-arbeid{background:var(--work)}
    .month-grid .cell .ev.cat-privat, .month-grid .cell .ev.cat-personlig{background:var(--privat)}
    .month-grid .cell .ev.cat-helse{background:var(--helse)}
    .month-grid .cell .ev.cat-reise{background:var(--reise)}
    .month-grid .cell .ev.proj, .month-grid .cell .ev.projevt{background:var(--accent-soft)}
    .month-grid .cell .more{background:var(--line)}

    /* ---- Måned: dagsagenda under minikalenderen (ADR 0051) ----
       Minikalenderen sier AT det skjer noe; agendaen under sier hva, for valgt dag.
       Samme .wa-*-komponenter som ukeagendaen. */
    #month-agenda{margin-top:12px}
    .month-grid .cell.sel{box-shadow:inset 0 0 0 2px var(--accent-soft)}
    .month-grid .cell.sel.today{box-shadow:inset 0 0 0 2px var(--accent)}

    /* ---- Uke: agenda (DOM fra _renderWeekAgenda) ---- */
    .week-agenda{display:flex; flex-direction:column; gap:24px; font-size:14px}
    .wa-day{background:none; border:none; border-radius:0; overflow:visible}
    .wa-day.today .wa-head{border-bottom-width:2px}
    .wa-head{display:flex; align-items:baseline; gap:8px; min-height:40px; padding:8px 0; background:none; border-bottom:1px solid var(--ink); cursor:pointer}
    .wa-dow{font-size:13px; font-weight:500; letter-spacing:0; color:var(--ink-soft)}
    .wa-num{font-family:var(--font); font-size:16px; font-weight:600; color:var(--ink)}
    .wa-day.today .wa-num{color:var(--ink); font-weight:700}
    .wa-hol{font-size:13px; color:var(--alert)}
    .wa-count{margin-left:auto; font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums}
    .wa-row{
      display:flex; gap:10px; align-items:flex-start; min-height:44px;
      padding:10px 0 10px 11px; border-top:1px solid var(--line-soft);
      border-left:3px solid var(--ink-muted); cursor:pointer;
    }
    /* I tidsrutenettene (Uke/Dag/Måned på PC) er tonen på Outlook-hendelser det som gjør
       dem til en blokk. I agendaen er de rader i en liste — der holder venstrestreken. */
    .wa-row.ev.ics{background:none}
    .wa-row.cat-arbeid{border-left-color:var(--work)}
    .wa-row.cat-privat, .wa-row.cat-personlig{border-left-color:var(--privat)}
    .wa-row.cat-helse{border-left-color:var(--helse)}
    .wa-row.cat-reise{border-left-color:var(--reise)}
    .wa-row.task{border-left-style:dashed}
    .wa-row:active{background:var(--surface-2)}
    .wa-time{flex:0 0 76px; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; padding-top:1px}
    .wa-title{flex:1; min-width:0; color:var(--ink); line-height:1.35; overflow-wrap:anywhere}
    .wa-title small{display:block; font-size:13px; color:var(--ink-muted); margin-top:1px}
    .wa-empty{padding:10px 0; color:var(--ink-muted)}

    /* ---- Hjem: rolig, ikke fylt rødt ---- */
    .home-list-urgent{background:none; border:none}
    .home-list-urgent .home-item{border-top-color:var(--line-soft)}
    .home-list-urgent .home-item:hover{background:var(--surface-2)}
    .home-item{min-height:48px}
    /* Hurtigfeltets forklaring er skrevet for desktop; på telefon holder knappen. */
    .home-quick-hint span:last-child{display:none}

    /* ---- Dag ---- */
    .day-hours{grid-template-columns:46px 1fr}
    .day-hours .hslot .ev{font-size:14px}

    /* ---- Årsoversikt: tidslinja ruller sidelengs, etikettkolonnen står ----
       Innerbredden på 900 px er der for at 24 måneder skal få plass — så etikettene
       må være klebrige for at du skal vite hvilken rad du ser på når du ruller. */
    .gantt-inner{min-width:900px}
    .gantt-headrow, .gantt-row{grid-template-columns:132px 1fr}
    .gantt-headrow .label-col, .gantt-row .label{position:sticky; left:0; z-index:2; background:var(--surface)}
    .gantt-headrow .label-col{background:var(--surface-2)}
    .gantt-row .label{padding:8px 10px}
    .gantt-row .track{min-height:40px}
    .gantt-scroll{-webkit-overflow-scrolling:touch}

    /* ---- Berøringsmål som ikke alt var 44 px ---- */
    .pview-toggle button, .psection h4 button, .pinline-add button, .btn-sec, .btn-sec-lg{min-height:40px}
    .modal .footer button{min-height:44px; padding:0 18px}
    .today-btn, .add-link{min-height:40px}
    .todo-row .actions > .ag, .todo-row .actions button, .ptdel,
    .todo-row:not([data-task-kind="inbox"]) .actions > .ag{min-width:44px; min-height:44px}

    /* Avkryssingsboksen: 44 px treffområde, 22 px synlig boks (ADR 0051).
       En native avkryssingsboks ignorerer polstring, og ::before treffer den ikke så
       lenge den er et erstattet element — derfor `appearance:none` og egen tegning.
       Negative marginer gjør at treffområdet er 44 px mens LAYOUT-bredden er 22, så
       raden ikke mister plass til tittelen. Den andre selektoren er ikke overflødig:
       ADR 0044-blokka setter `margin-top:2px` med høyere spesifisitet. */
    .todo-row input[type=checkbox],
    .todo-row:not([data-task-kind="inbox"]) input[type=checkbox],
    .ptask input[type=checkbox],
    .home-item input[type=checkbox]{
      appearance:none; -webkit-appearance:none;
      width:44px; height:44px; flex:0 0 44px; margin:-11px; padding:0;
      background:none; border:none; border-radius:0;
      display:grid; place-content:center; cursor:pointer;
    }
    .todo-row input[type=checkbox]::before,
    .ptask input[type=checkbox]::before,
    .home-item input[type=checkbox]::before{
      content:'✓'; width:22px; height:22px;
      display:grid; place-content:center;
      font-size:14px; line-height:1; color:transparent;
      border:1.5px solid var(--line); border-radius:6px; background:var(--surface);
      transition:background-color .12s, border-color .12s, color .12s;
    }
    /* PC tegner haken som en rotert vinkel og fyller selve boksen (ADR 0056). Her er
       boksen et 44 px treffområde, og tegningen ligger i ::before — nullstill begge. */
    .todo-row input[type=checkbox]:checked,
    .ptask input[type=checkbox]:checked,
    .home-item input[type=checkbox]:checked{background:none; border:none}
    .todo-row input[type=checkbox]::before,
    .ptask input[type=checkbox]::before,
    .home-item input[type=checkbox]::before{transform:none; border-color:color-mix(in srgb,var(--ink-muted) 70%,transparent)}
    .todo-row input[type=checkbox]:checked::before,
    .ptask input[type=checkbox]:checked::before,
    .home-item input[type=checkbox]:checked::before{
      background:var(--accent); border-color:var(--accent); color:var(--surface);
    }
    .todo-row input[type=checkbox]:focus-visible::before,
    .ptask input[type=checkbox]:focus-visible::before,
    .home-item input[type=checkbox]:focus-visible::before{outline:2px solid var(--accent); outline-offset:2px}

    /* Filterknappene: 40 px får plass i den 52 px høye topplinja (6 px polstring hver vei). */
    .filter button{min-height:40px}
    /* Prikkene i minikalenderen er ikke mål — dagen er målet. Uten dette ville et treff
       på en 6 px prikk åpnet hendelsen i stedet for dagen. */
    .month-grid .cell .ev, .month-grid .cell .more{pointer-events:none}

    /* ================================================================
       MOBIL 2.0 (ADR 0059) — én rad = én linje, ett trykk = alle valg
       ================================================================ */
    /* Rammen: ingen merkevare-tekst (fanen sier hvor du er), filteret til venstre */
    .brand{display:none}
    header.topbar{gap:8px; padding-left:14px; padding-right:6px}
    .filter{order:1; flex:0 1 210px; margin:0}
    .top-actions{order:3; margin-left:auto}

    /* Bunnmenyen: fire faner med ikon og ord */
    .nav{padding:2px 4px calc(2px + env(safe-area-inset-bottom, 0px))}
    .nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      min-height:54px; padding:6px 0 4px; font-size:12px; border-radius:0; overflow:visible}
    .nav button svg{width:24px; height:24px; flex:0 0 24px; fill:none; stroke:currentColor; stroke-width:1.6;
      stroke-linecap:round; stroke-linejoin:round}
    .nav button .nl{line-height:1.15}
    .nav button.active::before{display:none}
    .nav button.active svg{stroke-width:2.1}
    .nav button .badge, .nav button.active .badge{position:absolute; top:4px; left:calc(50% + 7px); margin:0; min-width:18px; height:18px;
      padding:0 5px; border-radius:9px; font-size:11px; font-weight:600; line-height:18px; text-align:center;
      background:var(--alert); color:var(--bg)}
    main{padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px))}
    .fab{bottom:calc(76px + env(safe-area-inset-bottom, 0px)); right:16px; width:56px; height:56px}
    .toast-stack{bottom:calc(144px + env(safe-area-inset-bottom, 0px))}

    /* Ett sted å legge inn noe nytt: +-knappen. Hurtigfeltene øverst på Hjem og To Do's
       tok 250 px før første oppgave. */
    .todo-quick, .home-quick{display:none}

    /* Kalenderbryter øverst i Dag/Uke/Måned/År */
    .cal-switch{display:flex; gap:2px; padding:3px; margin:2px 0 16px; border:1px solid var(--line);
      border-radius:10px; background:var(--surface)}
    .cal-switch button{flex:1; min-height:36px; border:none; background:none; border-radius:7px;
      font-size:14px; font-weight:500; color:var(--ink-soft)}
    .cal-switch button.on{background:var(--surface-2); color:var(--ink); font-weight:600}

    /* Radene: avkryssing | tittel (+ dato og prosjekt i flyten). Ingen knapper — et trykk
       på tittelen åpner arket. Sveip er som før: høyre = gjort, venstre = slett. */
    .todo-row:not([data-task-kind="inbox"]) > .actions{display:none}
    .todo-row{padding:12px 2px; gap:12px; min-height:48px}
    .todo-row:not([data-task-kind="inbox"]) .ttitle{display:block; font-size:15px; line-height:1.4; cursor:pointer}
    .todo-row .ttitle .due, .todo-row .ttitle .proj-chip{display:inline-block; margin-left:4px; font-size:13px; line-height:1.4}
    .todo-row:not([data-task-kind="inbox"]) .star-mark{display:inline; margin-right:2px}
    .todo-row.ms-row .ms-mark{margin-top:2px}
    /* Innboksen: sortering er hele poenget, så de tre prioritetene står synlige, med ord */
    .todo-row[data-task-kind="inbox"] .actions > :not(.prio-btn){display:none}
    .todo-row[data-task-kind="inbox"] .actions{gap:6px}
    .todo-row[data-task-kind="inbox"] .actions .prio-btn{flex:1 1 0; min-height:40px; padding:0 8px; font-size:13px;
      border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink-soft)}
    .todo-row[data-task-kind="inbox"] .actions .prio-btn .pb-l{display:inline}

    /* Bøttene kan brettes sammen — trykk på overskriften. Hjelpeteksten om å dra er borte:
       man drar ikke på telefon. */
    .todo-bucket > .bh{cursor:pointer; padding-right:26px; position:relative; -webkit-tap-highlight-color:transparent}
    .todo-bucket > .bh::after{content:""; position:absolute; right:6px; top:50%; width:7px; height:7px;
      margin-top:-6px; border-right:1.5px solid var(--ink-muted); border-bottom:1.5px solid var(--ink-muted);
      transform:rotate(45deg); transition:transform .15s}
    .todo-bucket.m-collapsed > .bh::after{transform:rotate(-45deg); margin-top:-4px}
    .todo-bucket.m-collapsed > :not(.bh){display:none}
    .todo-bucket.m-collapsed{padding-bottom:4px}
    .todo-bucket > .bh .bh-hint{display:none}

    /* Hjem: tittelen først, datoen til høyre — øyet leser hva før når */
    .home-item{padding:12px 2px; gap:12px; align-items:flex-start}
    .home-item .hi-title{order:2; flex:1 1 auto; min-width:0; font-size:15px; line-height:1.4}
    .home-item .hi-date{order:3; flex:0 0 auto; margin-left:4px; text-align:right; font-size:13px; padding-top:2px}
    .home-item .hi-date:empty{display:none}
    .home-item.hi-more-row{padding-left:2px}
    .home-projects .hp-row{padding:12px 2px}
    .home-projects .hp-when{order:3; margin-left:auto; padding-top:2px}

    /* Dag: dagens oppgaver først, timene under, notatene sist */
    .day-layout{display:flex; flex-direction:column; gap:22px}
    .day-side{display:contents}
    .day-side .tasks-block{order:-1}
    .day-main{order:0}
    .day-side .panel:not(.tasks-block){order:1}

    /* Årsoversikt: navnet over en tynn tidslinje i full bredde, i stedet for et 750 px
       rutenett som klippet stolpene */
    .gantt{border:none; background:none; border-radius:0}
    .gantt-scroll{overflow:visible}
    .gantt-inner{min-width:0}
    .gantt-headrow{grid-template-columns:1fr; background:none; border-bottom:1px solid var(--ink)}
    .gantt-headrow .label-col{display:none}
    .gantt-months .mtick:not(.year-start){font-size:0}
    .gantt-row{grid-template-columns:1fr; padding:12px 0 14px}
    .gantt-row .label{border:none; padding:0 0 8px; background:none; font-size:15px}
    .gantt-row .track{min-height:8px; height:8px; border-radius:4px; background:var(--surface-2)}
    .gantt-row .track .vline{display:none}
    .gantt-row .bar, .gantt-row .bar.point{top:0; height:8px; line-height:8px; padding:0; font-size:0; border-radius:4px}
    .gantt-row .bar.point{width:8px}

    /* Arkene: håndtak øverst, myke hjørner, plass til hjem-indikatoren */
    .modal{border-radius:16px 16px 0 0}
    .modal::before{content:""; display:block; width:36px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 0}
    .modal .footer{padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
    .row-sheet .rs-chips{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row-sheet[data-kind="inbox"] .rs-chips{grid-template-columns:repeat(3,minmax(0,1fr))}
    .todo-row .due-tap{text-decoration:none}
    .gantt-months{overflow:hidden}
    .qc-dest{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Planlegger</div>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-spacer"></div>
    <div class="filter" id="filter"></div>
    <div class="top-actions">
      <span id="sync-indicator" style="display:none;align-items:center;justify-content:center;width:24px;height:24px;font-size:14px;font-weight:700"></span>
      <button class="icon-btn" id="search-btn" title="Søk"><span class="icon" style="width:18px;height:18px"></span></button>
      <button class="icon-btn" id="settings-btn" title="Innstillinger"><span class="icon" style="width:18px;height:18px"></span></button>
    </div>
  </header>
  <main>
    <div class="container" id="view"></div>
  </main>
  <button class="fab" id="fab" title="Hurtignotat / Ny To Do" aria-label="Ny To Do"></button>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script src="app.js"></script>
</body>
</html>
